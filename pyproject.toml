[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-pipeline"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "nltk>=3.8",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "snowballstemmer>=2.2",
    "pint>=0.23",
    "python-dateutil>=2.8",
    "pandas>=2.0",
    "sympy>=1.12",
    "antlr4-python3-runtime==4.11.*",
    "tiktoken>=0.7",
    "langchain-text-splitters>=0.2",
    "torch>=2.12",
    "sentence-transformers>=3.0",
    "transformers>=5.2",
    "accelerate>=0.30",
    "huggingface-hub>=0.23",
    "networkx>=3.0",
    "tqdm>=4.66",
    "matplotlib (>=3.11.2,<4.0.0)",
    "pyvis (>=0.3.2,<0.4.0)",
]

[tool.setuptools]
py-modules = ["constants", "main"]
packages = ["pipeline"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
