[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-pipeline"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # text processing
    "beautifulsoup4>=4.12",
    "nltk>=3.8",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "snowballstemmer>=2.2",
    "pint>=0.23",
    "python-dateutil>=2.8",
    "pandas>=2.0",
    "sympy>=1.12",
    "antlr4-python3-runtime==4.11.*",
    "tiktoken>=0.7",
    "langchain-text-splitters>=0.2",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "transformers>=5.2",
    "accelerate>=0.30",
    "huggingface-hub>=0.23",
    "networkx>=3.0",
    "tqdm>=4.66",
]

[tool.setuptools]
py-modules = ["constants", "main"]
packages = ["pipeline"]

[tool.uv]
package = false
